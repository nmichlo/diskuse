# `cargo about`, which writes THIRD_PARTY_LICENSES.txt: run `just licenses`.

# the same list as `[licenses] allow` in deny.toml
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
]

# the release targets: the file lists what ships, so Windows-only crates are
# left out
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

# not compiled into the binary
ignore-dev-dependencies = true
ignore-build-dependencies = true
