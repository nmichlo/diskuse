[package]
name = "diskuse"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nmichlo/diskuse"
description = "Read-only disk usage browser for macOS and Linux, built for speed"
readme = "README.md"
keywords = ["disk", "du", "disk-usage", "cli", "tui"]
categories = ["command-line-utilities", "filesystem"]
# what crates.io gets: the sources of every target, so it builds and tests.
# bench/ and the repo tooling stay in git. the bench-gen example is kept, or
# cargo warns that its target is missing.
include = [
    "/src",
    "/tests",
    "/examples",
    "/README.md",
    "/LICENSE-*",
    "/THIRD_PARTY_LICENSES.txt",
]


[dependencies]
boxcar = "0.2.14"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
hashbrown = { version = "0.16.1", default-features = false }
memmap2 = "0.9.11"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rayon = "1.12.0"
rkyv = "0.8.18"
rustix = { version = "1.1.5", features = ["fs", "process", "time"] }
signal-hook = "0.3.18"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
