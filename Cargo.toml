# The workspace: three crates, released together under one version.
#
#   crates/diskuse-core    the library: scanner, tree, live scans, saved scans
#   crates/diskuse         the `diskuse` command and its browser
#   crates/diskuse-python  the Python bindings (PyPI, not crates.io)
[workspace]
resolver = "3"
members = ["crates/*"]
# what plain `cargo build` and `cargo test` cover: the bindings need Python
# and are built by maturin (pyproject.toml)
default-members = ["crates/diskuse-core", "crates/diskuse"]

# the tag is the only version: the release writes it here and into the
# internal pins below (nmichlo/.github actions/stamp-cargo-version)
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nmichlo/diskuse"

[workspace.dependencies]
diskuse-core = { path = "crates/diskuse-core", version = "0.0.0" }
diskuse = { path = "crates/diskuse", version = "0.0.0" }

[profile.release]
lto = "thin"
codegen-units = 1
