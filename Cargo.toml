[package]
name = "disksweep"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nmichlo/disksweep"
description = "Read-only disk usage browser for macOS and Linux, built for speed"
readme = "README.md"
keywords = ["disk", "du", "disk-usage", "cli", "tui"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
boxcar = "0.2.14"
clap = { version = "4.6.7", features = ["derive"] }
rayon = "1.12.0"
rustix = { version = "1.1.5", features = ["fs", "process"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
codegen-units = 1
