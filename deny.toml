# `cargo deny check`: advisories, licences, bans, sources.

[graph]
all-features = true

[advisories]
# Defaults: known vulnerabilities and unmaintained crates fail the check.

[licenses]
# Permissive licences compatible with `MIT OR Apache-2.0` only. Anything not
# listed fails.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "Unicode-3.0",
    # foldhash, via ratatui
    "Zlib",
]

# Runs only while compiling (a proc-macro's dependency, through arrow-array's
# ahash), so it is in no binary or wheel: public domain is fine there.
[[licenses.exceptions]]
crate = "tiny-keccak"
allow = ["CC0-1.0"]

[bans]
multiple-versions = "warn"
