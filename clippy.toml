# disksweep is read-only by construction: product code never changes the
# filesystem and never runs other programs. The exceptions opt out per call:
# `src/store.rs` saves scans in the cache dir, and `src/reveal.rs` runs
# `open` or `xdg-open` to show an item. Tests that build fixtures opt out per
# file.
disallowed-methods = [
    { path = "std::fs::remove_file", reason = "disksweep never deletes" },
    { path = "std::fs::remove_dir", reason = "disksweep never deletes" },
    { path = "std::fs::remove_dir_all", reason = "disksweep never deletes" },
    { path = "std::fs::rename", reason = "disksweep never renames" },
    { path = "std::fs::write", reason = "disksweep never writes files" },
    { path = "std::fs::copy", reason = "disksweep never writes files" },
    { path = "std::os::unix::fs::symlink", reason = "disksweep never creates links" },
    { path = "std::fs::soft_link", reason = "disksweep never creates links" },
    { path = "std::fs::hard_link", reason = "disksweep never creates files" },
    { path = "std::fs::create_dir", reason = "disksweep never creates directories" },
    { path = "std::fs::create_dir_all", reason = "disksweep never creates directories" },
    { path = "std::fs::set_permissions", reason = "disksweep never changes permissions" },
    { path = "std::fs::File::create", reason = "disksweep never writes files" },
    { path = "std::fs::File::create_new", reason = "disksweep never writes files" },
    { path = "std::fs::File::options", reason = "can open for writing; use the read-only opens in src/sys" },
    { path = "std::fs::OpenOptions::new", reason = "can open for writing; use the read-only opens in src/sys" },
    { path = "std::fs::DirBuilder::new", reason = "disksweep never creates directories" },
    { path = "std::process::Command::new", reason = "only src/reveal.rs runs programs" },
    { path = "rustix::fs::unlinkat", reason = "disksweep never deletes" },
    { path = "rustix::fs::renameat", reason = "disksweep never renames" },
    { path = "rustix::fs::mkdirat", reason = "disksweep never creates directories" },
    { path = "rustix::fs::openat", reason = "flags can write; only src/sys may call it, with fixed read-only flags" },
]
