name: release

# NB: `targets`, `bindings`, `bin-archives` are inputs of release-rust.yaml that
# exist only once nathan/release-rust-inputs is merged into nmichlo/.github.
# until then this workflow fails at startup.

# both triggers are required: a tag pushed with GITHUB_TOKEN does not start
# another workflow, so the bump and the release have to live in one run. it is
# `push` to main rather than a closed pull request because a PR from a fork gets
# a read-only token, so its merge could never push the tag.
on:
  push: {branches: [main], tags: ['v*']}

# least privilege: jobs that need more declare it themselves, and a job-level
# `permissions:` replaces this one rather than adding to it.
permissions:
  contents: read

jobs:
  release:
    # a reusable workflow cannot hold more permission than its caller. this one
    # pushes tags and creates releases (`contents`), and publishes to crates.io
    # over OIDC (`id-token`). omitting either fails the whole run at startup.
    # the version comes from the tag: Cargo.toml's 0.0.0 is stamped at build time.
    permissions:
      contents: write
      id-token: write
    uses: nmichlo/.github/.github/workflows/release-rust.yaml@main
    with:
      package-name: diskuse
      # the wheel is the Python module plus a `diskuse` console script
      # (pyproject.toml); the binary archives are built below
      # no Windows: diskuse is macOS and Linux only
      targets: >-
        [
          {"runs-on": "macos-15", "target": "aarch64"},
          {"runs-on": "macos-15-intel", "target": "x86_64"},
          {"runs-on": "ubuntu-latest", "target": "x86_64"},
          {"runs-on": "ubuntu-latest", "target": "aarch64"}
        ]
    # no secrets: publishing is OIDC, and release-rust.yaml declares none.

  # This job cannot live in the shared reusable workflow. PyPI matches the
  # `job_workflow_ref` OIDC claim, which names the file a job is WRITTEN in,
  # so a job inside release-rust.yaml can never match this repo's publisher:
  # pypa/gh-action-pypi-publish#166. It downloads the `wheels-*` artifacts the
  # reusable workflow uploaded.
  #
  # The filename is part of the claim, so the trusted publisher on PyPI (and on
  # crates.io, which checks `workflow_ref`) must name this file exactly.
  python-publish:
    name: Publish to PyPI
    needs: [release]
    # empty when the merge asked for no release, so nothing was built
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/diskuse
    permissions:
      id-token: write  # for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The binary on the GitHub release, one archive per target, for `cargo
  # binstall` and Homebrew. Built with cargo, not taken from the wheel, which
  # holds the Python module, not a binary. Linux builds are static (musl), so
  # they run on any distro.
  archives:
    needs: [release]
    if: needs.release.outputs.version != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runs-on: macos-15, target: aarch64-apple-darwin}
          - {runs-on: macos-15-intel, target: x86_64-apple-darwin}
          - {runs-on: ubuntu-latest, target: x86_64-unknown-linux-musl}
          - {runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write  # to upload to the release
    env:
      VERSION: ${{ needs.release.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version }}
          persist-credentials: false
      - uses: nmichlo/.github/actions/stamp-cargo-version@main
        with:
          version: ${{ needs.release.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y --no-install-recommends musl-tools
      - run: cargo build --release --locked --bin diskuse --target "${TARGET}" --config profile.release.strip=true
      - name: Archive and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="diskuse-${VERSION#v}-${TARGET}"
          mkdir stage
          cp "target/${TARGET}/release/diskuse" LICENSE-* THIRD_PARTY_LICENSES.txt README.md stage/
          (cd stage && tar -czf "../${name}.tar.gz" -- *)
          gh release upload "${VERSION}" "${name}.tar.gz" --repo "${GITHUB_REPOSITORY}"
