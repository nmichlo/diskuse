[package]
name = "diskuse-python"
version.workspace = true
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
description = "Python bindings of diskuse"
publish = false

[lib]
# the module `diskuse._diskuse`, wrapped by python/diskuse/__init__.py
name = "_diskuse"
crate-type = ["cdylib"]

[dependencies]
diskuse = { path = ".." }
# abi3: one wheel per platform for every Python from 3.9
pyo3 = { version = "0.29.3", features = ["abi3-py39"] }
