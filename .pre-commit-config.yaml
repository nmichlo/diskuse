# CI runs this file verbatim, see `.github/workflows/lint.yaml`.

# generated by `just licenses`. the fixers would make it differ from what
# cargo-about writes, which the licenses check in test.yaml compares against.
exclude: ^THIRD_PARTY_LICENSES\.txt$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - { id: trailing-whitespace }
      - { id: end-of-file-fixer }
      - { id: check-yaml }
      - { id: check-added-large-files, args: ["--maxkb=500"] }
      - { id: check-case-conflict }
      - { id: detect-private-key }

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
