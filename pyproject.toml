# The PyPI package: the Python API (`import diskuse`, all Rust, see
# crates/diskuse-python/src/lib.rs) and the `diskuse` command, a console script calling the
# same CLI as the binary.

[build-system]
# 1.9.3: the first to put `license-files` in the sdist too
requires = ["maturin>=1.9.3,<2"]
build-backend = "maturin"

[project]
name = "diskuse"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-*", "THIRD_PARTY_LICENSES.txt"]
# abi3-py39: one wheel per platform for every Python from 3.9
requires-python = ">=3.9"
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: System :: Filesystems",
]
description = "A fast, read-only disk usage browser for macOS and Linux"
# from the workspace's Cargo.toml. CI stamps its version from the release tag
dynamic = ["version"]

[project.scripts]
diskuse = "diskuse:_cli"

[project.optional-dependencies]
test = ["pytest", "pyarrow>=14"]

[project.urls]
Repository = "https://github.com/nmichlo/diskuse"
Issues = "https://github.com/nmichlo/diskuse/issues"

[tool.maturin]
manifest-path = "crates/diskuse-python/Cargo.toml"
module-name = "diskuse"
# the stub is beside this file, where maturin takes it for a wheel: without
# this a wheel built from the sdist has no types
include = [{ path = "diskuse.pyi", format = "sdist" }]
# here, not in Cargo's release profile, so local release builds keep symbols
# for profiling
strip = true

# ruff reads `requires-python` above, which is for the wheel. the Python here
# (tests, bench, the example) is dev-only and needs 3.10
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# `E4/E7/E9 + F` is the ruff default, `I` sorts imports, `UP` modernises
# syntax for the python floor, `TID251` enforces the banned-api list below.
# `B009`/`B010` ban `getattr(x, "const")` / `setattr(x, "const", v)`.
select = ["E4", "E7", "E9", "F", "I", "UP", "TID251", "B009", "B010"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Any disables type checking wherever it appears. Use a precise type, a TypeVar, a Protocol, or a dedicated sentinel class."
"typing.cast".msg = "cast asserts a type the checker cannot verify. Narrow with isinstance/assert, or fix the annotation."

[tool.ruff.lint.isort]
force-single-line = true

# ty runs as a pre-commit hook. it needs the package built into `.venv`:
#     uv sync --extra test
[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
# its dependencies are inline (PEP 723), so not in `.venv`
exclude = ["crates/diskuse-python/examples"]

# rebuild the extension when the Rust changes, not only pyproject.toml
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "crates/*/Cargo.toml" },
    { file = "crates/*/src/**/*.rs" },
]
