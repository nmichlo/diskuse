[package]
name = "diskuse-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Python bindings of diskuse"
publish = false

[lib]
# the module `diskuse`; maturin names the file after it
name = "diskuse_python"
crate-type = ["cdylib"]

[dependencies]
diskuse-core.workspace = true
# the `diskuse` console script is the command itself
diskuse.workspace = true
# abi3: one wheel per platform for every Python from 3.9
pyo3 = { version = "0.29.3", features = ["abi3-py39"] }
# Tree.__arrow_c_stream__: the Arrow C stream interface, no pyarrow needed
arrow-array = { version = "60", default-features = false, features = ["ffi"] }
